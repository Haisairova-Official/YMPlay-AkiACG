<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="theme-color" content="#e5f4fc">
  <title>YiMaiPlay 音乐游戏控制器</title>
  <style>
    :root { color-scheme: light; font-family: Inter, Arial, "PingFang SC", "Microsoft YaHei", sans-serif; background: #e5f4fc; color: #102b3c; }
    * { box-sizing: border-box; }
    html, body { width: 100%; height: 100%; margin: 0; overflow: hidden; }
    [hidden] { display: none !important; }
    h1, p, dl, dd { margin: 0; }
    .banner {
      --layout-release: forum-inline-1;
      --forum-hint-space: 34px;
      position: relative;
      width: 100%;
      height: 100%;
      overflow: hidden;
      container-type: size;
      isolation: isolate;
      background: #e5f4fc;
    }
    .banner::before { content: ""; position: absolute; inset: 0; z-index: -1; background: linear-gradient(18deg, #d8effb 0 25%, #f2faff 25% 64%, #d8effb 64%); }
    .logo { position: absolute; left: 7%; top: 7%; width: clamp(100px, 18cqw, 260px); height: auto; max-height: 20%; object-fit: contain; object-position: left; }
    .copy { position: absolute; left: 7%; top: 29%; width: 43%; pointer-events: none; }
    .eyebrow { font-size: clamp(11px, 1.1cqw, 16px); margin-bottom: 2cqh; color: #436779; }
    h1 { font-size: clamp(34px, 14cqh, 66px); font-weight: 900; font-style: italic; line-height: 1.1; letter-spacing: -.045em; }
    h1 span { position: relative; display: inline-block; }
    h1 span::after { content: ""; position: absolute; left: 0; right: 0; bottom: -.07em; height: .065em; background: #ff8594; }
    .subline { font-size: clamp(10px, 1.05cqw, 15px); color: #436779; margin-top: 5cqh; }
    .facts { position: absolute; inset: 0; opacity: 0; visibility: hidden; }
    .facts dl { display: flex; gap: 3cqw; }
    .facts dl > div { display: flex; flex-direction: column-reverse; }
    .facts dt { font-size: clamp(11px, 1cqw, 16px); }
    .facts dd { font-size: clamp(32px, 14cqh, 66px); font-weight: 800; line-height: 1.2; letter-spacing: -.04em; }
    .facts small { font-size: .42em; }
    .stage { position: absolute; left: 50%; top: 0; width: 50%; height: 100%; pointer-events: none; }
    .photo, model-viewer {
      position: absolute;
      inset: 0 0 auto;
      width: 100%;
      height: calc(100% - var(--forum-hint-space));
      object-fit: contain;
      visibility: hidden;
      pointer-events: none;
    }
    .photo { display: block; object-position: center; }
    model-viewer { display: block; outline: none; --poster-color: transparent; touch-action: none; user-select: none; cursor: grab; }
    model-viewer:active { cursor: grabbing; }
    model-viewer::part(default-ar-button) { display: none; }
    .turntable-host { position: absolute; inset: 0; visibility: hidden; }
    [data-visual="photo"] .photo { visibility: visible; }
    [data-visual="model"] model-viewer { visibility: visible; pointer-events: auto; }
    [data-visual="turntable"] .turntable-host { visibility: visible; }
    .hint { position: absolute; left: 0; right: 0; bottom: 9px; color: #34576a; text-align: center; font-size: 12px; }
    .preview-cta { position: absolute; left: 7%; bottom: 6%; padding: 8px 22px; border: 1px solid #34576a; border-radius: 24px; color: #12374c; background: #fff; text-decoration: none; font-size: 14px; }
    .preview-cta:focus-visible { outline: 3px solid #00cfe7; outline-offset: 4px; }
    @keyframes message-cycle {
      0%, 40%, 100% { opacity: 1; visibility: visible; transform: translateY(0); }
      46%, 94% { opacity: 0; visibility: hidden; transform: translateY(-8px); }
    }
    @keyframes facts-cycle {
      0%, 40%, 100% { opacity: 0; visibility: hidden; transform: translateY(8px); }
      46%, 94% { opacity: 1; visibility: visible; transform: translateY(0); }
    }
    @media (prefers-reduced-motion: no-preference) {
      .message { animation: message-cycle 12s ease infinite; }
      .facts { animation: facts-cycle 12s ease infinite; }
    }
    .paused .message, .paused .facts, .interacting .message, .interacting .facts { animation-play-state: paused; }
    @media (max-width: 700px) {
      .banner { --forum-hint-space: 28px; }
      .logo { left: 5%; top: 6%; width: 29%; }
      .copy { left: 50px; top: 29%; width: calc(50% - 60px); }
      .eyebrow { font-size: 10px; margin-bottom: 6px; }
      h1 { font-size: clamp(18px, calc(12.5cqw - 18px), 30px); white-space: nowrap; }
      .subline { display: none; }
      .hint { font-size: 10px; bottom: 8px; }
      .facts .eyebrow { font-size: 9px; white-space: nowrap; }
      .facts dl { flex-direction: column; gap: 6px; }
      .facts dd { font-size: 29px; line-height: 1.05; }
      .facts dt { font-size: 9px; line-height: 1.3; }
      .preview-cta { left: 50px; bottom: 6%; padding: 6px 14px; font-size: 12px; }
    }
    @media (max-width: 360px) { .eyebrow { font-size: 9px; } }
  </style>
</head>
<body>
  <main class="banner paused" id="banner" data-visual="photo" style="visibility:hidden;opacity:0" aria-hidden="true" aria-label="YiMaiPlay 控制器产品展示">
    <img class="logo" id="logo" src="../assets/wordmark.webp?v=20261119-4" width="900" height="187" alt="YiMaiPlay">
    <div class="copy">
      <div class="message">
        <p class="eyebrow">音乐游戏控制器</p>
        <h1>磨砂玻璃<br><span>环形按键</span></h1>
        <p class="subline">HAN DEVICE × LiHong Workshop</p>
      </div>
      <div class="facts">
        <p class="eyebrow">双核 32 bit ARM 主控</p>
        <dl><div><dt>分区无痕触摸</dt><dd>34</dd></div><div><dt>触摸刷新率</dt><dd>333 <small>Hz</small></dd></div></dl>
      </div>
    </div>
    <div class="stage" id="stage">
      <img class="photo" id="photo" src="../assets/cabinet.webp?v=20261119-4" width="890" height="1110" alt="YiMaiPlay 控制器与桌架">
      <model-viewer id="model" camera-controls disable-pan disable-tap disable-zoom touch-action="none"
        alt="YiMaiPlay 控制器，拖动旋转" camera-target="0m 0.925m 0m" camera-orbit="30deg 78deg 105%"
        min-camera-orbit="auto 20deg 45%" max-camera-orbit="auto 100deg 250%"
        field-of-view="30deg" min-field-of-view="30deg" max-field-of-view="30deg"
        shadow-intensity="0.8" shadow-softness="0.85" exposure="1.1" environment-image="neutral"
        interaction-prompt="none" loading="eager" tabindex="-1"><span slot="progress-bar"></span></model-viewer>
      <div class="turntable-host" id="turntable-host"></div>
      <p class="hint" id="hint" hidden>拖动旋转</p>
    </div>
    <a class="preview-cta" id="preview-cta" href="https://yimaiplay.akiacg.com/" hidden>了解更多</a>
  </main>
  <script>
  (() => {
    'use strict';
    const release = 'forum-inline-1';
    const forumOrigin = 'https://forum.akiacg.com';
    const embedded = window.parent !== window;
    const banner = document.getElementById('banner');
    const stage = document.getElementById('stage');
    const logo = document.getElementById('logo');
    const model = document.getElementById('model');
    const host = document.getElementById('turntable-host');
    const hint = document.getElementById('hint');
    const motion = matchMedia('(prefers-reduced-motion: reduce)');
    let ready = false;
    let parentPaused = embedded;
    let inViewport = true;
    let pageInactive = false;
    let interacting = false;
    let modelReady = false;
    let turntable = null;
    let turntablePending = null;
    let turntableGeneration = 0;
    let resizeFrame = null;
    let assetsStarted = false;

    function postState() {
      if (embedded) window.parent.postMessage({ type: ready ? 'yimaiplay:banner-ready' : 'yimaiplay:banner-error', release }, forumOrigin);
    }
    function updatePlayback() {
      const paused = !ready || parentPaused || document.hidden || !inViewport || pageInactive || motion.matches;
      banner.classList.toggle('paused', paused);
      banner.classList.toggle('interacting', interacting);
      model.autoRotate = modelReady && !paused && !interacting;
    }
    function onInteraction(active) {
      interacting = active;
      updatePlayback();
    }
    function chooseVisual(visual) {
      banner.dataset.visual = visual;
      model.tabIndex = visual === 'model' ? 0 : -1;
      model.setAttribute('aria-hidden', String(visual !== 'model'));
      document.getElementById('photo').setAttribute('aria-hidden', String(visual !== 'photo'));
      host.inert = visual !== 'turntable';
      hint.hidden = visual === 'photo';
    }
    function checkLayout() {
      const frame = banner.getBoundingClientRect();
      const product = stage.getBoundingClientRect();
      const wordmark = logo.getBoundingClientRect();
      const style = getComputedStyle(banner);
      const alpha = style.backgroundColor.match(/(?:^rgba\([^)]*,|\/)\s*([\d.]+)(%)?\s*\)$/);
      const opaqueBackground = style.backgroundColor !== 'transparent' &&
        (!alpha || Number(alpha[1]) >= (alpha[2] ? 100 : 1));
      const valid = style.getPropertyValue('--layout-release').trim() === release &&
        style.position === 'relative' && opaqueBackground &&
        frame.width > 0 && frame.height > 0 &&
        Math.abs(frame.width - innerWidth) < 2 && Math.abs(frame.height - innerHeight) < 2 &&
        Math.abs(product.width - frame.width / 2) < 2 && Math.abs(product.height - frame.height) < 2 &&
        Math.abs(product.left - frame.width / 2) < 2 && Math.abs(product.top) < 2 &&
        wordmark.width > 0 && wordmark.width <= Math.min(frame.width * .35, 270) &&
        wordmark.height > 0 && wordmark.height <= frame.height * .22;
      const changed = ready !== valid;
      ready = valid;
      banner.style.visibility = valid ? 'visible' : 'hidden';
      banner.style.opacity = valid ? '1' : '0';
      banner.setAttribute('aria-hidden', String(!valid));
      updatePlayback();
      if (changed || !valid) postState();
      if (valid && !assetsStarted) { assetsStarted = true; loadModel(); }
      return valid;
    }
    async function showTurntable() {
      if (modelReady || turntable || turntablePending) return;
      const generation = turntableGeneration;
      const task = (async () => {
        const { mountTurntable } = await import('../ad/forum-turntable.js?v=20261119-4');
        if (modelReady || generation !== turntableGeneration) return;
        const result = await mountTurntable(host, new URL('../ad/forum-turntable.webp?v=20261119-4', location.href), { onInteraction });
        if (modelReady || generation !== turntableGeneration) { result.destroy(); return; }
        turntable = result;
        chooseVisual('turntable');
      })();
      turntablePending = task;
      try { await task; } catch { /* The supplied photograph stays visible. */ }
      finally { if (turntablePending === task) turntablePending = null; }
    }
    function hasWebGL() {
      try {
        const context = document.createElement('canvas').getContext('webgl2');
        if (!context) return false;
        context.getExtension('WEBGL_lose_context')?.loseContext();
        return true;
      } catch { return false; }
    }
    async function loadModel() {
      if (!hasWebGL()) { showTurntable(); return; }
      const fallbackTimer = setTimeout(showTurntable, 6000);
      model.addEventListener('load', () => {
        clearTimeout(fallbackTimer);
        modelReady = true;
        turntableGeneration += 1;
        turntablePending = null;
        turntable?.destroy();
        turntable = null;
        interacting = false;
        model.autoRotateDelay = 2000;
        model.rotationPerSecond = '5deg';
        chooseVisual('model');
        updatePlayback();
      });
      model.addEventListener('error', () => {
        modelReady = false;
        chooseVisual(turntable ? 'turntable' : 'photo');
        updatePlayback();
        showTurntable();
      });
      try {
        await import('../model/vendor/model-viewer.min.js?v=20261119-4');
        model.src = new URL('../model/yimaiplay.glb?v=20261119-4', location.href).href;
      } catch { clearTimeout(fallbackTimer); showTurntable(); }
    }
    const pointers = new Set();
    model.addEventListener('pointerdown', event => { pointers.add(event.pointerId); onInteraction(true); });
    function endInteraction(event) {
      if (pointers.delete(event.pointerId) && pointers.size === 0) onInteraction(false);
    }
    window.addEventListener('pointerup', endInteraction);
    window.addEventListener('pointercancel', endInteraction);
    model.addEventListener('lostpointercapture', endInteraction);
    model.addEventListener('dblclick', event => event.preventDefault());
    window.addEventListener('message', event => {
      if (!embedded || event.origin !== forumOrigin || event.source !== window.parent) return;
      if (event.data?.type === 'yimaiplay:ad-status-request') {
        checkLayout();
        postState();
      } else if (event.data?.type === 'yimaiplay:ad-playback' && typeof event.data.paused === 'boolean') {
        parentPaused = event.data.paused;
        updatePlayback();
      }
    });
    motion.addEventListener('change', updatePlayback);
    document.addEventListener('visibilitychange', () => { interacting = false; pointers.clear(); updatePlayback(); });
    window.addEventListener('pagehide', () => { pageInactive = true; updatePlayback(); });
    window.addEventListener('pageshow', () => { pageInactive = false; checkLayout(); updatePlayback(); });
    if ('IntersectionObserver' in window) new IntersectionObserver(entries => {
      inViewport = entries[0].isIntersecting;
      updatePlayback();
    }).observe(banner);
    if ('ResizeObserver' in window) new ResizeObserver(() => {
      cancelAnimationFrame(resizeFrame);
      resizeFrame = requestAnimationFrame(checkLayout);
    }).observe(banner);
    logo.addEventListener('load', checkLayout);
    document.getElementById('preview-cta').hidden = embedded;
    chooseVisual('photo');
    checkLayout();
  })();
  </script>
</body>
</html>
