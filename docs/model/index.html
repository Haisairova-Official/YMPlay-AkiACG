<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#edf1f3">
  <title>YiMaiPlay · 3D 模型预览</title>
  <script>
    const modelParams = new URLSearchParams(location.search);
    if (modelParams.has('embed')) document.documentElement.classList.add('embedded');
    if (modelParams.get('placement') === 'forum-slider') document.documentElement.classList.add('forum-model');
  </script>
  <!-- Keep the embedded frame styled on its first paint. -->
  <style>
:root {
  color-scheme: light;
  font-family: Inter, "Helvetica Neue", Arial, "PingFang SC", "Microsoft YaHei", sans-serif;
  color: #233947;
  background: #edf1f3;
  font-synthesis: none;
}

* { box-sizing: border-box; }
body { margin: 0; }
button, a { -webkit-tap-highlight-color: transparent; }
button { font: inherit; cursor: pointer; }
button:focus-visible, a:focus-visible { outline: 3px solid #009ca9; outline-offset: 5px; }
a { color: inherit; text-decoration: none; }
p, h1 { margin: 0; }
[hidden] { display: none !important; }

.viewer-shell {
  display: grid;
  grid-template-rows: auto minmax(280px, 1fr) auto;
  height: 100vh;
  height: 100dvh;
  min-height: 510px;
  overflow: hidden;
  background: radial-gradient(ellipse at 50% 42%, #fff 0%, #f4f7f8 38%, #e5ecef 100%);
}

.viewer-header {
  display: flex;
  align-items: center;
  gap: 22px;
  padding: 26px 38px;
  position: relative;
  z-index: 1;
}

.brand { font-size: 25px; font-style: italic; font-weight: 850; letter-spacing: -1.2px; }
.viewer-header h1 { font-weight: 450; font-size: 14px; color: #6c7b84; }
.preview-label { margin-left: auto; font-size: 12px; color: #74848d; }
.model-stage { min-height: 0; position: relative; }
model-viewer { height: 100%; width: 100%; outline: none; --poster-color: transparent; }
model-viewer::part(default-ar-button) { display: none; }
.load-state {
  position: absolute;
  inset: 0;
  display: flex;
  flex-direction: column;
  justify-content: center;
  align-items: center;
  gap: 14px;
  font-size: 14px;
  color: #6c7b84;
  background: #f1f5f7;
}

.loader { width: 26px; height: 26px; border-radius: 50%; border: 2px solid #d4e1e6; border-top-color: #27778f; animation: spin 1s linear infinite; }
@keyframes spin { to { transform: rotate(360deg); } }
.load-state button { border: 1px solid #bcced8; background: white; border-radius: 20px; color: #233947; padding: 8px 18px; }
.dimensions { position: absolute; left: 40px; bottom: 30px; pointer-events: none; }
.dimensions p { font-size: 11px; color: #72848e; line-height: 1.8; }
.dimensions strong { font-size: 18px; line-height: 1.9; font-weight: 550; letter-spacing: -.5px; }
.dimensions strong span { font-size: 12px; }
.zoom-controls { position: absolute; right: 38px; bottom: 30px; display: grid; gap: 6px; }
.zoom-controls button { width: 39px; height: 39px; display: grid; place-items: center; border: 1px solid #c5d2d9; border-radius: 50%; color: #354c59; background: #ffffffc9; font-size: 24px; font-weight: 350; }
.zoom-controls button:hover { background: white; border-color: #91a7b3; }
.viewer-controls { display: flex; flex-direction: column; align-items: center; padding: 5px 20px 25px; gap: 13px; }
.view-controls { display: flex; gap: 3px; align-items: center; padding: 5px; border: 1px solid #d3dce1; background: #ffffffd9; border-radius: 30px; box-shadow: 0 6px 20px #2a4c5f05; }
.view-controls > span { width: 1px; height: 18px; background: #dbe3e7; margin-inline: 5px; }
.view-controls button { border: 0; background: transparent; color: #49606d; border-radius: 23px; padding: 9px 17px; font-size: 13px; }
.view-controls button:hover { background: #eaf1f4; }
.view-controls button[aria-pressed="true"] { background: #284e60; color: white; }
.view-controls #reset { padding-inline: 14px; }
#reset span { margin-left: 4px; font-size: 16px; }
.gesture-hint { font-size: 11px; color: #80919b; letter-spacing: .05em; }
.touch-hint { display: none; }
.no-script { position: fixed; bottom: 20px; left: 20px; z-index: 2; padding: 10px; background: white; }

@media (pointer: coarse) {
  .mouse-hint { display: none; }
  .touch-hint { display: inline; }
}

@media (max-width: 640px) {
  .viewer-header { padding: 22px 22px 10px; gap: 14px; }
  .brand { font-size: 24px; }
  .viewer-header h1 { font-size: 12px; }
  .preview-label { display: none; }
  .dimensions { left: 22px; bottom: 20px; }
  .dimensions strong { font-size: 15px; }
  .zoom-controls { right: 22px; bottom: 20px; }
  .zoom-controls button { width: 37px; height: 37px; }
  .viewer-controls { padding-bottom: max(21px, env(safe-area-inset-bottom)); gap: 13px; }
  .view-controls button { padding: 9px 13px; }
  .view-controls #reset { padding-inline: 10px; }
}

@media (prefers-reduced-motion: reduce) {
  .loader { animation: none; }
}

/* The advertisement owns its caption and controls around the embedded model. */
.embedded, .embedded body { color-scheme: dark; background: transparent; }
.embedded .viewer-shell { min-height: 0; grid-template-rows: minmax(0, 1fr); background: transparent; }
.embedded .viewer-header, .embedded .viewer-controls,
.embedded .dimensions, .embedded .zoom-controls { display: none; }
.embedded .load-state { background: transparent; }

.forum-model model-viewer { touch-action: none; cursor: grab; user-select: none; }
.forum-model model-viewer:active { cursor: grabbing; }
    .model-note { color: #65717a; font-size: clamp(9px, 2.5vw, 12px); line-height: 1.3; white-space: nowrap; }
  </style>
  <script type="module" src="vendor/model-viewer.min.js?v=20261119-4"></script>
  <script defer src="viewer.js?v=20261119-4"></script>
</head>
<body>
  <main class="viewer-shell">
    <header class="viewer-header">
      <a class="brand" href="../"><img src="../assets/wordmark.webp?v=20261119-4" width="118" alt="YiMaiPlay"></a>
      <h1>3D 模型预览</h1>
    </header>

    <div class="model-stage">
      <model-viewer
        id="product-model"
        src="yimaiplay.glb?v=20261122-1"
        alt="YiMaiPlay 音乐游戏控制器三维模型，包含机身、环形按键与支架。可拖动旋转和缩放查看。"
        camera-controls
        disable-pan
        disable-tap
        touch-action="none"
        camera-target="0m 0.925m 0m"
        camera-orbit="30deg 78deg 105%"
        min-camera-orbit="auto 20deg 45%"
        max-camera-orbit="auto 100deg 250%"
        field-of-view="30deg"
        min-field-of-view="30deg"
        max-field-of-view="30deg"
        shadow-intensity="0.8"
        shadow-softness="0.85"
        exposure="1.1"
        environment-image="neutral"
        interaction-prompt="none"
        loading="eager">
        <span slot="progress-bar"></span>
      </model-viewer>

      <div class="load-state" id="load-state" role="status" aria-live="polite">
        <span class="loader" aria-hidden="true"></span>
        <p id="load-message">正在载入模型</p>
        <button id="retry" hidden>重新加载</button>
      </div>

      <aside class="dimensions" aria-label="含桌整体尺寸">
        <p>含桌整体尺寸</p>
        <strong>90 × 60 × 185 <span>cm</span></strong>
        <p>长 × 宽 × 高</p>
      </aside>

      <div class="zoom-controls" role="group" aria-label="缩放控制">
        <button type="button" id="zoom-in" aria-label="放大模型" title="放大">+</button>
        <button type="button" id="zoom-out" aria-label="缩小模型" title="缩小">−</button>
      </div>
    </div>

    <footer class="viewer-controls">
      <div class="view-controls" role="group" aria-label="选择模型视角">
        <button type="button" data-view="front" aria-pressed="false">正面</button>
        <button type="button" data-view="side" aria-pressed="false">侧面</button>
        <button type="button" data-view="back" aria-pressed="false">背面</button>
        <span aria-hidden="true"></span>
        <button type="button" id="reset">重置视角 <span aria-hidden="true">↺</span></button>
      </div>
      <p class="model-note">*模型仅供展示参考，与量产机型有细微差别，建议参考实拍照片后选购。</p>
      <p class="gesture-hint"><span class="mouse-hint">拖动旋转 · 滚轮缩放</span><span class="touch-hint">单指旋转 · 双指缩放</span></p>
    </footer>
  </main>
  <noscript><p class="no-script">请开启 JavaScript 以旋转查看模型。</p></noscript>
</body>
</html>
